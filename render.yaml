services:
  - type: web
    name: neonadai
    runtime: node
    plan: free
    buildCommand: buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/index.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: AI_INTEGRATIONS_GEMINI_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_GEMINI_BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
